name: Lib build

permissions:
  contents: read

on:
  schedule:
    - cron: "0 0 * * 0"
  push:
  pull_request:

jobs:
  check_format_build:
    name: Lib - Check, Format, Build
    runs-on: ubuntu-latest
    steps:
      #Checkout source
      - name: Checkout sources
        uses: actions/checkout@v7

      #Cache cargo dependencies
      - name: Cache cargo dependencies
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: lib-${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            lib-${{ runner.os }}-cargo-

      #toolchain and tools
      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
          components: rustfmt, clippy

      #build and lint
      - name: Run cargo check
        run: cargo check
      - name: Run cargo fmt
        run: cargo fmt --all -- --check
      - name: Run cargo clippy
        run: cargo clippy -- -D warnings
      - name: Run cargo clippy with log
        run: cargo clippy --features log -- -D warnings
      - name: Run cargo clippy with defmt
        run: cargo clippy --features defmt -- -D warnings
      - name: Run cargo clippy on tests
        run: cargo clippy --tests -- -D warnings
      - name: Run cargo test
        run: cargo test
      - name: Run cargo build
        run: cargo build
      - name: Run cargo build with log
        run: cargo build --features log
      - name: Run cargo build with defmt
        run: cargo build --features defmt